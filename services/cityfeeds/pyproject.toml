[project]
name = "cityfeeds"
version = "0.1.0"
description = "Sajag city feeds for Mumbai — air quality (Open-Meteo/CAMS; CPCB/MPCB stations via OpenAQ/WAQI; National AQI bands), heat at Santacruz and Colaba (heat index, IMD coastal heatwave test), GDACS Arabian Sea cyclones, NDMA Sachet CAP alerts, USGS quakes, NASA FIRMS, the Apollo Bunder tide model checked against the BMC's published tides, an EMULATED Mithi gauge, Mumbai Traffic Police notices, Mapillary stills; cached, rate-limited, honestly labelled; PROPOSALS only (a named officer decides)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cityfeeds"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
