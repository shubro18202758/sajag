  <text x="20" y="32" font-size="21" font-weight="700" fill="#262626">Sajag — Citizen: check your road (/citizen, public)</text>
  <text x="20" y="56" font-size="13" font-weight="400" fill="#5E5E5E">Shown in Marathi (English is the default), phone width (400 px), no sign-in. The page scrolls; the orange line marks the first screen.</text>
