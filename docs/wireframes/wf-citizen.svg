  <text x="406" y="346" font-size="16" font-weight="400" text-anchor="end" fill="#5E5E5E">×</text>
  <text x="60" y="386" font-size="12" font-weight="650" fill="#1D5FD1">शहरातील सर्व रस्ते ›</text>
  <rect x="60" y="404" width="360" height="312" rx="16" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="7 5"/>
  <rect x="61" y="405" width="358" height="76" rx="15" fill="url(#hatch)" stroke="#9A9A9A" stroke-width="1.2"/>
  <text x="240" y="443" font-size="13" font-weight="600" text-anchor="middle" fill="#8A8A8A">रस्त्याचा नकाशा</text>
  <rect x="314" y="492" width="94" height="22" rx="11" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="361" y="507" font-size="11" font-weight="600" text-anchor="middle" fill="#5E5E5E">मॉडेल-आधारित</text>
  <text x="76" y="508" font-size="12" font-weight="600" fill="#5E5E5E">डॉ. आंबेडकर मार्ग (हिंदमाता)</text>
  <rect x="76" y="522" width="36" height="36" rx="8" fill="#262626"/>
  <text x="94" y="547" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="124" y="548" font-size="22" font-weight="700" fill="#262626">खोल पाणी</text>
  <text x="76" y="586" font-size="15" font-weight="500" fill="#262626">सुमारे 45 मिनिटांत खोल पाणी (10 ते 30 सेमी)</text>
  <text x="76" y="608" font-size="15" font-weight="500" fill="#262626">साचू शकते. शक्य असल्यास कृपया दुसरा</text>
  <text x="76" y="630" font-size="15" font-weight="500" fill="#262626">रस्ता वापरा.</text>
  <rect x="76" y="656" width="83.9" height="40" rx="20" fill="#262626" stroke="#262626" stroke-width="1.2"/>
  <text x="127" y="680.9" font-size="13.5" font-weight="650" text-anchor="middle" fill="#FFFFFF">ऐका</text>
  <polygon points="96.4,670 96.4,682 106,676" fill="#FFFFFF"/>
  <text x="171.9" y="681" font-size="11.5" font-weight="600" fill="#5E5E5E">कृत्रिम आवाज</text>
  <text x="60" y="746" font-size="15" font-weight="700" fill="#262626">समुद्राची भरती-ओहोटी</text>
  <rect x="333.1" y="731" width="86.9" height="20" rx="10" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="376.6" y="744.6" font-size="10" font-weight="600" text-anchor="middle" fill="#5E5E5E">मॉडेल-आधारित</text>
  <text x="60" y="770" font-size="13.5" font-weight="400" fill="#262626">भरती येत आहे, आता 4.6 मीटर. भरतीमुळे निचऱ्याचे</text>
  <text x="60" y="790" font-size="13.5" font-weight="400" fill="#262626">दरवाजे बंद, म्हणून पावसाचे पाणी हळू ओसरते. पुढील भरती 14:00 ला.</text>
  <text x="60" y="828" font-size="15" font-weight="700" fill="#262626">पाऊस</text>
  <rect x="377.6" y="813" width="42.4" height="20" rx="10" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.1"/>
  <text x="398.8" y="826.6" font-size="10" font-weight="600" text-anchor="middle" fill="#5E5E5E">थेट</text>
  <text x="60" y="852" font-size="13.5" font-weight="400" fill="#262626">आता पाऊस पडत आहे, ताशी सुमारे 18 मिमी.</text>
  <text x="60" y="890" font-size="15" font-weight="700" fill="#262626">या रस्त्यांवर लक्ष ठेवा</text>
  <rect x="60" y="906" width="360" height="38" rx="10" fill="#F4F4F4" stroke="#A2A2A2" stroke-width="1.2"/>
  <text x="74" y="931" font-size="13.5" font-weight="600" fill="#262626">किंग्ज सर्कल</text>
  <rect x="320" y="914" width="22" height="22" rx="5" fill="#262626"/>
  <text x="331" y="930" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="350" y="931" font-size="12.5" font-weight="600" fill="#262626">खोल पाणी</text>
  <rect x="60" y="950" width="360" height="38" rx="10" fill="#F4F4F4" stroke="#A2A2A2" stroke-width="1.2"/>
  <text x="74" y="975" font-size="13.5" font-weight="600" fill="#262626">सायन सर्कल</text>
  <rect x="320" y="958" width="22" height="22" rx="5" fill="#262626"/>
  <text x="331" y="974" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="350" y="975" font-size="12.5" font-weight="600" fill="#262626">खोल पाणी</text>
  <rect x="60" y="994" width="360" height="38" rx="10" fill="#F4F4F4" stroke="#A2A2A2" stroke-width="1.2"/>
  <text x="74" y="1019" font-size="13.5" font-weight="600" fill="#262626">दादर टीटी सर्कल</text>
  <rect x="320" y="1002" width="22" height="22" rx="5" fill="#DCDCDC"/>
  <text x="331" y="1018" font-size="12" font-weight="700" text-anchor="middle" fill="#262626">1</text>
  <text x="350" y="1019" font-size="12.5" font-weight="600" fill="#262626">थोडे पाणी</text>
  <rect x="60" y="1046" width="360" height="222" rx="16" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <text x="76" y="1076" font-size="15" font-weight="700" fill="#262626">वाहतूक सूचना</text>
  <text x="76" y="1096" font-size="11.5" font-weight="400" fill="#5E5E5E">ड्युटी अधिकाऱ्याच्या मंजुरीने प्रसिद्ध · 12:35</text>
  <text x="76" y="1124" font-size="13.5" font-weight="400" fill="#262626">पुढील 120 मिनिटांत या ठिकाणी पाणी साचण्याची</text>
  <text x="76" y="1144" font-size="13.5" font-weight="400" fill="#262626">शक्यता: हिंदमाता, किंग्ज सर्कल, सायन सर्कल.</text>
  <text x="76" y="1164" font-size="13.5" font-weight="400" fill="#262626">शक्य असल्यास हे मार्ग टाळा. साचलेल्या पाण्यात विजेचे</text>
  <text x="76" y="1184" font-size="13.5" font-weight="400" fill="#262626">खांब किंवा तारा यांना स्पर्श करू नका.</text>
  <rect x="76" y="1208" width="83.9" height="40" rx="20" fill="#262626" stroke="#262626" stroke-width="1.2"/>
  <text x="127" y="1232.9" font-size="13.5" font-weight="650" text-anchor="middle" fill="#FFFFFF">ऐका</text>
  <polygon points="96.4,1222 96.4,1234 106,1228" fill="#FFFFFF"/>
  <text x="171.9" y="1233" font-size="11.5" font-weight="600" fill="#5E5E5E">कृत्रिम आवाज</text>
  <text x="60" y="1294" font-size="13" font-weight="650" fill="#5E5E5E">आपत्कालीन मदत</text>
  <rect x="60" y="1304" width="174" height="48" rx="24" fill="#FFFFFF" stroke="#8E8E8E" stroke-width="1.2"/>
  <text x="147" y="1333.4" font-size="15" font-weight="650" text-anchor="middle" fill="#262626">आपत्कालीन ११२</text>
  <rect x="246" y="1304" width="174" height="48" rx="24" fill="#FFFFFF" stroke="#8E8E8E" stroke-width="1.2"/>
  <text x="333" y="1333" font-size="14" font-weight="650" text-anchor="middle" fill="#262626">रुग्णवाहिका (१०८)</text>
  <text x="60" y="1376" font-size="11" font-weight="400" fill="#5E5E5E">पावसाचा अंदाज (ओपन-मेटिओ मॉडेल, पर्जन्यमापक नव्हे), अंदाजे</text>
  <text x="60" y="1392" font-size="11" font-weight="400" fill="#5E5E5E">भरतीचे मॉडेल आणि जमिनीच्या माहितीवरून मॉडेल-आधारित गणना. पंपांची</text>
  <text x="60" y="1408" font-size="11" font-weight="400" fill="#5E5E5E">स्थिती एम्युलेटेड.</text>
  <line x1="60" y1="1428" x2="420" y2="1428" stroke="#DCDCDC" stroke-width="1.2"/>
  <text x="60" y="1448" font-size="11.5" font-weight="600" fill="#262626">आपले स्थान घेतले जात नाही. सूचनेत फक्त रस्त्याचा भाग आणि</text>
  <text x="60" y="1465" font-size="11.5" font-weight="600" fill="#262626">वेळ असते.</text>
  <text x="60" y="1486" font-size="10.5" font-weight="400" fill="#5E5E5E">साइन इनची गरज नाही · नकाशा माहिती © OpenStreetMap योगदानकर्ते</text>
  <circle cx="446" cy="142" r="10" fill="#4A4A4A"/>
  <text x="446" y="146" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="38" cy="320" r="10" fill="#4A4A4A"/>
  <text x="38" y="324" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <circle cx="38" cy="524" r="10" fill="#4A4A4A"/>
  <text x="38" y="528" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <circle cx="38" cy="680" r="10" fill="#4A4A4A"/>
  <text x="38" y="684" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <circle cx="38" cy="742" r="10" fill="#4A4A4A"/>
  <text x="38" y="746" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <circle cx="38" cy="1072" r="10" fill="#4A4A4A"/>
  <text x="38" y="1076" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
  <circle cx="38" cy="1328" r="10" fill="#4A4A4A"/>
  <text x="38" y="1332" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">7</text>
  <circle cx="38" cy="1426" r="10" fill="#4A4A4A"/>
  <text x="38" y="1430" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">8</text>
  <text x="500" y="112" font-size="16" font-weight="700" fill="#262626">What to look at</text>
  <circle cx="510" cy="140" r="10" fill="#4A4A4A"/>
  <text x="510" y="144" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="530" y="144" font-size="12.5" font-weight="400" fill="#262626">Language switch: मरा · EN · हिं. English is the default; Marathi is shown</text>
  <text x="530" y="161.5" font-size="12.5" font-weight="400" fill="#262626">here. The choice is kept in a cookie. Marathi digits (०–९) appear only</text>
  <text x="530" y="179" font-size="12.5" font-weight="400" fill="#262626">through the formatter.</text>
  <circle cx="510" cy="206.5" r="10" fill="#4A4A4A"/>
  <text x="510" y="210.5" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="530" y="210.5" font-size="12.5" font-weight="400" fill="#262626">Road search: type a road or a junction in Marathi, Hindi or English. No</text>
  <text x="530" y="228" font-size="12.5" font-weight="400" fill="#262626">location is asked for: the page never uses the phone's position,</text>
  <text x="530" y="245.5" font-size="12.5" font-weight="400" fill="#262626">camera or microphone.</text>
  <circle cx="510" cy="273" r="10" fill="#4A4A4A"/>
  <text x="510" y="277" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="530" y="277" font-size="12.5" font-weight="400" fill="#262626">The road's status: waterlogging class 0 to 3 in plain words (कोरडे,</text>
  <text x="530" y="294.5" font-size="12.5" font-weight="400" fill="#262626">थोडे पाणी, खोल पाणी, वाहतुकीस अयोग्य), when, and what to do. Dashed, with</text>
  <text x="530" y="312" font-size="12.5" font-weight="400" fill="#262626">the label मॉडेल-आधारित (modelled).</text>
  <circle cx="510" cy="339.5" r="10" fill="#4A4A4A"/>
  <text x="510" y="343.5" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="530" y="343.5" font-size="12.5" font-weight="400" fill="#262626">Listen (ऐका): the advisory read aloud by a synthetic voice, labelled</text>
  <text x="530" y="361" font-size="12.5" font-weight="400" fill="#262626">कृत्रिम आवाज ("synthetic voice"); generated on the platform's own</text>
  <text x="530" y="378.5" font-size="12.5" font-weight="400" fill="#262626">server.</text>
  <circle cx="510" cy="406" r="10" fill="#4A4A4A"/>
  <text x="510" y="410" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="530" y="410" font-size="12.5" font-weight="400" fill="#262626">Tide and rain, each with its own label: the Arabian Sea tide is modelled</text>
  <text x="530" y="427.5" font-size="12.5" font-weight="400" fill="#262626">(outfall gates shut at high tide), the rain nowcast is live.</text>
  <circle cx="510" cy="455" r="10" fill="#4A4A4A"/>
  <text x="510" y="459" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
  <text x="530" y="459" font-size="12.5" font-weight="400" fill="#262626">The traffic advisory (वाहतूक सूचना) appears only after a duty</text>
  <text x="530" y="476.5" font-size="12.5" font-weight="400" fill="#262626">officer approves it; the assistant drafts, a named officer publishes.</text>
  <circle cx="510" cy="504" r="10" fill="#4A4A4A"/>
  <text x="510" y="508" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">7</text>
  <text x="530" y="508" font-size="12.5" font-weight="400" fill="#262626">Emergency numbers as large tap targets: 112 and ambulance (108).</text>
  <text x="530" y="525.5" font-size="12.5" font-weight="400" fill="#262626">No claim of a partnership.</text>
  <circle cx="510" cy="553" r="10" fill="#4A4A4A"/>
  <text x="510" y="557" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">8</text>
  <text x="530" y="557" font-size="12.5" font-weight="400" fill="#262626">Where the numbers come from, in plain Marathi; then the privacy line</text>
  <text x="530" y="574.5" font-size="12.5" font-weight="400" fill="#262626">("collects no location") and "no sign-in". Never on this page: a</text>
  <text x="530" y="592" font-size="12.5" font-weight="400" fill="#262626">registration mark, a field report, a pursuit, an operator code.</text>
  <rect x="500" y="629.5" width="470" height="112" rx="10" fill="#F4F4F4" stroke="#ABABAB" stroke-width="1.2"/>
  <text x="516" y="653.5" font-size="13" font-weight="650" fill="#262626">Always</text>
  <text x="516" y="675.5" font-size="12" font-weight="400" fill="#262626">Day theme; type floors: status 22 px, controls 44 px.</text>
  <text x="516" y="695.5" font-size="12" font-weight="400" fill="#262626">Every modelled or simulated figure dashed and labelled.</text>
  <text x="516" y="715.5" font-size="12" font-weight="400" fill="#262626">Polite register (आपण); short sentences ending in a full stop.</text>
</svg>
